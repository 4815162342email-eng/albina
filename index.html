<title>Принцесса Альбина</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&family=Neucha&display=swap">
<style>
/* Layout: one 1280×720 storybook stage, scaled to fit, floating on a night-violet page.
   Single deliberate look (the game's own world), so no light/dark switch. */
:root {
  --night: #241A3A;
  --paper: #FFFBF2;
  --ink: #2B2140;
  --magic: #7B4FD6;
  --sun: #FFD23F;
  --rasp: #B8336A;
  --mist: #EFE6FB;
  --err: #FFE1E1;
  --ok: #E1F6E4;
  --f-display: "Neucha", "Marker Felt", "Comic Sans MS", cursive;
  --f-body: "Balsamiq Sans", "Trebuchet MS", "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--night); color: var(--paper); font-family: var(--f-body); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0;
}
#viewport { position: relative; width: 100%; height: 100%; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; border-radius: 22px; background: var(--paper); color: var(--ink); user-select: none; -webkit-user-select: none; }
.scene { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; display: block; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; }

/* paper & stickers */
.sheet { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 20px; box-shadow: 0 6px 0 rgba(43, 33, 64, .35); }
.btn { font-family: var(--f-display); font-size: 30px; line-height: 1; color: var(--ink); background: var(--sun); border: 3px solid var(--ink); border-radius: 18px; padding: 12px 26px; box-shadow: 0 5px 0 var(--ink); cursor: pointer; transition: transform .08s, box-shadow .08s; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.alt { background: var(--paper); }
.btn.magic { background: var(--magic); color: var(--paper); }
.btn.big { font-size: 40px; padding: 16px 36px; }
.btn:disabled { opacity: .45; cursor: default; transform: none; }
button { font-family: inherit; }
button:focus-visible, [role=button]:focus-visible { outline: 4px solid var(--magic); outline-offset: 3px; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 24px; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 5px 16px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
.chip svg { width: 26px; height: 26px; }
.chip.icon-only { padding: 6px 10px; }
.chip[aria-pressed="false"] { opacity: .55; }

/* top bar */
.topbar { position: absolute; left: 16px; right: 16px; top: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 20; pointer-events: none; }
.topbar > * { pointer-events: auto; }
.tb-left, .tb-right { display: flex; gap: 10px; align-items: center; }
.bag { display: flex; gap: 4px; background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 2px 10px; align-items: center; box-shadow: 0 3px 0 var(--ink); }
.bag-item { width: 46px; height: 46px; border: none; background: none; padding: 1px; cursor: pointer; border-radius: 50%; }
.bag-item svg { width: 44px; height: 44px; display: block; }
.bag-item.sel { background: var(--sun); box-shadow: 0 0 0 3px var(--ink); animation: pulse 1s infinite; }

/* dialog, notes, toast */
.dialog { position: absolute; left: 40px; right: 40px; bottom: 18px; padding: 18px 26px 16px; z-index: 30; display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; align-items: end; animation: rise .25s ease-out; }
.d-name { grid-column: 1 / -1; justify-self: start; font-family: var(--f-display); font-size: 24px; color: var(--paper); padding: 2px 16px; border-radius: 999px; margin-top: -38px; border: 3px solid var(--ink); }
.d-text { margin: 0; font-size: 28px; line-height: 1.38; max-width: 60ch; }
.d-row { display: flex; gap: 10px; align-items: center; }
.toast { position: absolute; left: 50%; top: 86px; transform: translateX(-50%) rotate(-1deg); padding: 12px 22px; font-size: 25px; z-index: 40; max-width: 760px; text-align: center; animation: pop .25s ease-out; }
.toast.err { background: var(--err); }
.toast.ok { background: var(--ok); }
.note { position: absolute; z-index: 15; padding: 14px 20px; font-size: 22px; line-height: 1.35; }
.note h2 { font-size: 34px; margin-bottom: 6px; color: var(--magic); }
.note.goal { left: 50%; top: 100px; transform: translateX(-50%) rotate(-.6deg); max-width: 640px; text-align: center; }
.recipe-card { left: 28px; top: 80px; width: 400px; transform: rotate(-1.2deg); background: #FFF6DA; }
.recipe { margin: 0; padding-left: 28px; display: grid; gap: 6px; }
.rnote { margin: 8px 0 0; font-weight: 700; color: var(--rasp); }
.swamp-note { left: 50%; top: 84px; transform: translateX(-50%); width: 780px; text-align: center; }
.door-note { left: 50%; top: 84px; transform: translateX(-50%) rotate(-.6deg); width: 720px; text-align: center; }
.wolf-note, .mir-note { left: 50%; top: 84px; transform: translateX(-50%); width: 760px; text-align: center; }
.duel-note { left: 50%; top: 84px; transform: translateX(-50%); width: 720px; text-align: center; }

/* title & end */
.title-block { position: absolute; left: 60px; top: 96px; width: 560px; display: grid; gap: 10px; z-index: 5; }
.title-block h1 { font-size: 104px; line-height: .95; color: var(--ink); text-shadow: 0 4px 0 var(--paper); transform: rotate(-2deg); }
.title-block .sub { margin: 0 0 18px; font-family: var(--f-display); font-size: 40px; color: var(--magic); text-shadow: 0 3px 0 var(--paper); }
.menu { display: grid; gap: 14px; justify-items: start; }
.menu-row { display: flex; gap: 14px; flex-wrap: wrap; }
.end-block { position: absolute; left: 40px; top: 84px; width: 560px; padding: 22px 28px; z-index: 5; display: grid; gap: 12px; transform: rotate(-1deg); }
.end-block h1 { font-size: 72px; color: var(--rasp); }
.end-block p { margin: 0; font-size: 24px; line-height: 1.35; }

/* map */
.node { position: absolute; transform: translate(-50%, -50%); font-family: var(--f-display); font-size: 30px; color: var(--ink); background: var(--paper); border: 3px solid var(--ink); border-radius: 999px; padding: 6px 22px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; z-index: 6; }
.node.cur { background: var(--sun); animation: bob 1.4s ease-in-out infinite; }
.node.done { background: #DDF2DF; }
.map-ward { position: absolute; left: 70px; bottom: 34px; z-index: 6; }

/* lab */
.ing { cursor: pointer; }
.ing .lbl, .lbl { font-family: var(--f-body); font-size: 14px; fill: var(--ink); }
.ing:hover .ing-in, .ing:focus-visible .ing-in { transform: scale(1.12); }
.ing-in { transition: transform .15s; }
.ing.hop .ing-in { animation: hop .35s ease-out; }
.ing.glow .ing-in, .pad-in.glow, .mir.glow circle { filter: drop-shadow(0 0 10px #FFE45C) drop-shadow(0 0 4px #FFE45C); }
.pot { position: absolute; left: 446px; top: 318px; width: 300px; min-height: 64px; padding: 6px 12px; display: flex; gap: 8px; align-items: center; font-size: 18px; z-index: 6; }
.pot-items { display: flex; flex-wrap: wrap; gap: 2px; align-items: center; }
.pot-items svg { width: 36px; height: 36px; }
.pot-items em { color: #7A6E92; }
.lab-btns { position: absolute; right: 36px; bottom: 34px; display: flex; gap: 14px; z-index: 6; }
#bubbles .bub { animation: bub 1.8s ease-in infinite; }
.flicker { animation: flick .5s ease-in-out infinite alternate; transform-origin: 640px 690px; }
.puff { animation: puff 1.1s ease-out forwards; transform-origin: 650px 420px; }

/* bridge */
.pat { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); padding: 14px 22px 18px; z-index: 10; display: grid; gap: 12px; justify-items: center; }
.pat-head { display: flex; gap: 18px; align-items: baseline; font-size: 24px; }
.pat-head span { font-size: 18px; color: #6B5E85; }
.pat-row, .pat-opts { display: flex; gap: 8px; }
.pat-opts { gap: 14px; padding-top: 6px; border-top: 2px dashed #CFC4E3; }
.tile { width: 72px; height: 72px; border: 3px solid var(--ink); border-radius: 14px; background: #FFFFFF; display: grid; place-items: center; padding: 0; }
.tile svg { width: 56px; height: 56px; }
.tile.empty { background: #EDE6F7; font-family: var(--f-display); font-size: 40px; color: var(--magic); border-style: dashed; }
.tile.opt { cursor: pointer; box-shadow: 0 4px 0 var(--ink); background: #FFF6DA; }
.tile.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.num { font-family: var(--f-display); font-size: 40px; color: var(--ink); }
.rain .rd { animation: fall 1.2s linear infinite; }
.shake { animation: shake .4s; }

/* swamp */
.pad { cursor: pointer; }
.pad-in { transition: opacity .4s, transform .4s; }
.pad-in.sunk { opacity: .2; transform: scale(.8); }
.padnum { font-family: var(--f-display); font-size: 24px; fill: var(--ink); pointer-events: none; }
.mini { transition: transform .35s cubic-bezier(.3, 1.6, .5, 1); pointer-events: none; }
#cloud { transition: transform 2.2s ease-in-out, opacity 2.2s; }
#cloud.away { transform: translate(520px, -140px); opacity: .5; }
.beam { cursor: pointer; animation: glowp 1s ease-in-out infinite alternate; }

/* door, wolf, mirrors, duel */
.sym-pal { position: absolute; right: 28px; top: 300px; width: 340px; padding: 16px; display: grid; gap: 14px; justify-items: center; z-index: 10; }
.sym-grid { display: grid; grid-template-columns: repeat(4, 72px); gap: 8px; }
.fade { transition: opacity .8s; }
.hidden { opacity: 0; }
.growl { animation: growl .9s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
#wolf { cursor: pointer; }
.mir { cursor: pointer; }
.mline { transition: transform .25s ease-out; }
.mir:hover circle { stroke: #FFE45C; }
.beamline { pointer-events: none; }
.wiz-float { animation: float 3s ease-in-out infinite; }
.casting { filter: drop-shadow(0 0 16px #9B5CF6); }
.hit { animation: shake .5s; }
.vanish { transition: transform 1.2s ease-in, opacity 1.2s; transform-box: fill-box; transform-origin: center bottom; transform: scale(.1); opacity: 0; }
.hp { position: absolute; right: 120px; top: 230px; display: flex; gap: 4px; align-items: center; font-family: var(--f-display); font-size: 22px; color: var(--paper); background: rgba(43, 33, 64, .8); border-radius: 999px; padding: 4px 14px; z-index: 6; }
.hp svg { width: 32px; height: 32px; }
.hp svg.lost { opacity: .2; filter: grayscale(1); }
.spells { position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%); display: flex; gap: 22px; z-index: 6; }
.spell { width: 112px; height: 112px; border-radius: 50%; border: 4px solid var(--ink); cursor: pointer; box-shadow: 0 6px 0 var(--ink); display: grid; place-items: center; transition: transform .1s, filter .1s; }
.spell svg { width: 70px; height: 70px; }
.spell.s0 { background: #FFF1B8; } .spell.s1 { background: #CFE0FF; } .spell.s2 { background: #E7DAFF; } .spell.s3 { background: #D6F2D9; }
.spell.lit { transform: scale(1.14); filter: brightness(1.15) drop-shadow(0 0 18px #FFF6B0); }

/* Eren */
.clap { position: absolute; left: 22px; bottom: 26px; z-index: 12; display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 21px; line-height: 1.05; text-align: left; color: var(--ink); background: #CFEFFF; border: 3px solid var(--ink); border-radius: 18px; padding: 6px 14px 6px 8px; box-shadow: 0 5px 0 var(--ink); cursor: pointer; }
.clap svg { width: 52px; height: 52px; }
.clap-n { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--sun); border: 3px solid var(--ink); font-size: 20px; }
.clap:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--ink); }
.eren-pop { position: absolute; left: 30px; bottom: 0; z-index: 35; display: flex; align-items: flex-start; gap: 6px; animation: slidein .45s ease-out; transition: transform .5s, opacity .5s; pointer-events: none; }
.eren-pop.out { transform: translateX(-120%); opacity: 0; }
.eren-fig { width: 130px; height: 470px; }
.eren-pop .bubble { margin-top: 70px; max-width: 420px; padding: 14px 18px; font-size: 24px; line-height: 1.3; background: #EAF7FF; }

/* book & album */
.overlay { position: absolute; inset: 0; background: rgba(36, 26, 58, .6); z-index: 50; display: grid; place-items: center; }
.book { width: 980px; max-height: 620px; overflow: auto; padding: 26px 32px; display: grid; gap: 16px; justify-items: start; background: #FFF6DA; }
.book h2 { font-size: 52px; color: var(--magic); }
.book h3 { font-size: 30px; margin-bottom: 10px; }
.book-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; width: 100%; }
.sym-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.sym-card { display: grid; justify-items: center; text-align: center; gap: 2px; background: var(--paper); border: 2px solid var(--ink); border-radius: 14px; padding: 8px; font-size: 18px; }
.sym-card svg { width: 54px; height: 54px; }
.sym-card span { font-size: 15px; color: #6B5E85; }
.muted { color: #6B5E85; font-size: 20px; margin: 0; }
.album { position: absolute; inset: 0; background: var(--mist); padding: 80px 40px 30px; overflow: auto; }
.album-head { display: flex; gap: 24px; align-items: baseline; margin-bottom: 18px; }
.album-head h2 { font-size: 56px; color: var(--magic); }
.album-head p { margin: 0; font-size: 22px; color: var(--ink); }
.album-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.a-card { display: grid; gap: 6px; padding: 8px; background: var(--paper); border: 3px solid var(--ink); border-radius: 16px; box-shadow: 0 4px 0 var(--ink); cursor: pointer; font-family: var(--f-display); font-size: 22px; color: var(--ink); }
.a-card:nth-child(odd) { transform: rotate(-1deg); } .a-card:nth-child(even) { transform: rotate(1deg); }
.a-card img { width: 100%; height: 170px; object-fit: cover; border-radius: 10px; display: block; }
.a-big { max-width: 1100px; padding: 14px; display: grid; gap: 10px; }
.a-big img { max-height: 540px; max-width: 100%; object-fit: contain; border-radius: 12px; display: block; margin: 0 auto; }
.a-big-row { display: flex; justify-content: space-between; align-items: center; gap: 20px; font-family: var(--f-display); font-size: 30px; }

/* wardrobe */
.ward { position: absolute; left: 620px; top: 78px; width: 630px; padding: 18px 24px 20px; z-index: 5; display: grid; gap: 10px; justify-items: start; }
.ward h2 { font-size: 46px; color: var(--rasp); }
.ward-cats { display: flex; flex-wrap: wrap; gap: 10px 26px; }
.ward-cat h3 { font-size: 24px; margin-bottom: 4px; color: #6B5E85; }
.ward-items { display: flex; gap: 8px; }
.w-item { width: 98px; display: grid; justify-items: center; gap: 2px; padding: 6px 4px 8px; background: #FFFFFF; border: 3px solid var(--ink); border-radius: 14px; cursor: pointer; font-family: var(--f-body); font-size: 14px; line-height: 1.1; color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
.w-item svg { width: 64px; height: 64px; }
.w-item[aria-pressed="true"] { background: var(--sun); }

/* characters & effects */
.char .eyes, .mini .eyes, #heroW .eyes { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
.spin-slow { animation: spin 40s linear infinite; }
.wag { animation: wag .6s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: left center; }
.spark { animation: spark 1s ease-out forwards; }
.twinkle path { animation: twinkle 2.4s ease-in-out infinite alternate; }
.confetti .cf { animation: fall 3s linear infinite; }

@keyframes pop { from { transform: translateX(-50%) scale(.8); opacity: 0; } }
@keyframes rise { from { transform: translateY(20px); opacity: 0; } }
@keyframes bob { 50% { transform: translate(-50%, -58%); } }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--sun); } }
@keyframes hop { 40% { transform: translateY(-18px) scale(1.1); } }
@keyframes bub { from { transform: translateY(0); opacity: .6; } to { transform: translateY(-70px); opacity: 0; } }
@keyframes flick { to { transform: scaleY(1.08) scaleX(.97); } }
@keyframes puff { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(1.6) translateY(-60px); } }
@keyframes fall { from { transform: translateY(-40px); } to { transform: translateY(780px); } }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(5px); } }
@keyframes glowp { to { filter: drop-shadow(0 0 22px #FFE45C); } }
@keyframes growl { 50% { transform: scale(1.03, .97); } }
@keyframes float { 50% { transform: translateY(-14px); } }
@keyframes slidein { from { transform: translateX(-120%); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes wag { to { transform: rotate(14deg); } }
@keyframes spark { from { transform: translate(0, 0) scale(1); opacity: 1; } to { transform: translate(var(--dx), var(--dy)) scale(.3); opacity: 0; } }
@keyframes twinkle { to { opacity: .3; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .rain, .confetti { display: none; }
}

</style>

addEventListener('resize', fit);

  });
};

/* ----- Волшебная дуэль ----- */
const SPELLS = [['sun', 'Солнце'], ['drop', 'Капля'], ['star', 'Звезда'], ['leaf', 'Листик']];
SC.duel = () => {
  add(svg(BG.caveIn(true) + `<g id="wizWrap"><g id="wiz" class="wiz-float">${at(990, 690 - 390 * .82, .82, ART.wizard())}</g></g>` + hero(260, 704, .8) + `<g id="broJoin" class="fade hidden">${at(420, 704 - 234 * .62, .62, ART.brother())}</g>`));
  topbar({ map: true });
  const status = note('', 'duel-note');
  const hp = add(`<div class="hp" aria-label="Сила Рарина"></div>`);
  const pad = add(`<div class="spells">${SPELLS.map(([k, n], i) => `<button class="spell s${i}" data-i="${i}" aria-label="${n}"><svg viewBox="-34 -34 68 68" aria-hidden="true">${SYM[k]}</svg></button>`).join('')}</div>`);
  const btns = $$('.spell', pad);
  let round = 0, seq = [], pos = 0, busy = true, life = 3;
  const setStatus = t => { status.innerHTML = t; speak(status.textContent); };
  const drawHP = () => { hp.innerHTML = `<span>Сила Рарина</span>` + [0, 1, 2].map(i => `<svg viewBox="-32 -32 64 64" class="${i < life ? '' : 'lost'}" aria-hidden="true">${SYM.bolt}</svg>`).join(''); };
  const flash = i => { const b = btns[i]; b.classList.add('lit'); sfx.spell(i); later(() => b.classList.remove('lit'), 430); };
  const showSeq = slow => {
    busy = true; pos = 0; setStatus(`<b>Раунд ${round + 1} из 3.</b> Смотри внимательно, какие заклинания колдует волшебник…`);
    const gap = slow ? 1150 : 760; $('#wiz').classList.add('casting');
    seq.forEach((v, i) => later(() => flash(v), 700 + i * gap));
    later(() => { busy = false; $('#wiz').classList.remove('casting'); setStatus(`<b>Раунд ${round + 1} из 3.</b> Теперь повтори заклинания в том же порядке!`); }, 700 + seq.length * gap);
  };
  const newRound = () => { const len = [4, 5, 6][round]; seq = []; for (let i = 0; i < len; i++) seq.push(Math.floor(Math.random() * 4)); showSeq(); };
  btns.forEach(b => b.onclick = () => {
    if (busy) return; const i = +b.dataset.i; flash(i);
    if (i !== seq[pos]) { sfx.err(); busy = true; setStatus('Ха-ха! Не то заклинание! Смотри ещё раз.'); later(() => showSeq(), 1500); return; }
    pos++;
    if (pos === seq.length) {
      busy = true; life--; drawHP(); sparkle(990, 400, 16); later(sfx.ok, 300); $('#wiz').classList.add('hit'); later(() => $('#wiz').classList.remove('hit'), 600);
      round++;
      if (round >= 3) later(finish, 1200); else { setStatus('Получилось! Волшебник теряет силу. Следующий раунд будет длиннее.'); later(newRound, 1900); }
    }
  });
  const finish = () => {
    pad.remove(); hp.remove(); $('#clapBtn') && $('#clapBtn').remove(); status.remove();
    $('#wiz').classList.add('casting'); sfx.magic(); sparkle(990, 420, 24);
    later(() => { $('#wizWrap').classList.add('vanish'); }, 500);
    later(() => {
      const w = $('#wizWrap'); w.classList.remove('vanish'); w.classList.add('fade', 'hidden');
      w.innerHTML = `<g class="char">${at(990, 704 - 326 * .95, .95, ART.knight())}</g>`;
      void w.getBoundingClientRect(); w.classList.remove('hidden'); sparkle(990, 450, 20); sfx.win();
      $('#broJoin').classList.remove('hidden');
    }, 1800);
    later(() => talk([{ who: 'Альбина', text: 'Твоё злое волшебство больше не работает!' },
    { who: 'Рассказчик', text: 'Яркий свет окутал Рарина, и злые чары рассеялись. Оказалось, что Рарин вовсе не злой волшебник, а заколдованный добрый рыцарь!' },
    { who: 'Рарин', text: 'Спасибо тебе, принцесса Альбина! Ты меня расколдовала. Прости меня, Мирин. Теперь я буду охранять ваш замок.' },
    { who: 'Мирин', text: 'Альбина, ты самая лучшая сестра на свете! Пойдём домой!', end: 'Домой' }], () => { setStep(STEP.end); go('end'); }), 3000);
  };
  drawHP();
  talk([{ who: 'Рарин', text: 'Я буду колдовать, а ты повторяй. Ошибёшься — начнём заново! Ха-ха!', end: 'Начать' }], () => newRound());
  clapButton(() => {
    if (busy) return 'Подожди, волшебник ещё колдует. Потом позови меня снова!';
    showSeq(true); return 'Я попрошу его колдовать помедленнее. Смотри!';
  });
};

/* ----- Финал ----- */
SC.end = () => {
  let conf = '<g class="confetti" aria-hidden="true">'; for (let i = 0; i < 60; i++) { const x = Math.random() * 1280, c = ['#FFD23F', '#FF7EB6', '#9B5CF6', '#4FD1C5', '#E0402F'][i % 5], d = (Math.random() * 3).toFixed(2), du = (2.5 + Math.random() * 2).toFixed(2); conf += `<g transform="translate(${x.toFixed(0)} 0)"><rect class="cf" style="animation-delay:-${d}s;animation-duration:${du}s" x="-5" y="-8" width="10" height="16" rx="2" fill="${c}"/></g>`; } conf += '</g>';
  add(svg(BG.castle() + `<g class="char">${at(250, 704 - 341 * .66, .66, ART.eren())}</g>` + hero(420, 704, .8) + `<g class="char">${at(560, 704 - 234 * .66, .66, ART.brother())}</g>` + `<g class="char">${at(790, 704 - 326 * .8, .8, ART.knight())}</g>` + `<g class="char">${at(1010, 690, 1.05, ART.wolf(false))}</g>` + conf));
  topbar({ book: false, bag: false });
  const el = add(`<div class="end-block sheet"><h1>Мирин спасён!</h1><p>Альбина, Мирин, Эрен, добрый волк и рыцарь Рарин вернулись в замок на горе.</p><div class="menu-row"><button class="btn big" id="eAgain">Играть снова</button><button class="btn alt" id="eWard">Гардероб</button><button class="btn alt" id="eAlb">Альбом</button></div></div>`);
  sfx.win(); speak('Мирин спасён!');
  $('#eAgain', el).onclick = () => { sfx.click(); const keep = { outfit: S.outfit, voice: S.voice, sound: S.sound }; S = Object.assign(clone(DEF_S), keep); save(); go('intro'); };
  $('#eWard', el).onclick = () => { sfx.click(); go('wardrobe', 'end'); };
  $('#eAlb', el).onclick = () => { sfx.click(); go('album'); };
};

/* ----- Гардероб ----- */
const WARD = [
  { cat: 'Платья', items: [['gown', 'Малиновое платье'], ['stars', 'Платье со звёздами']] },
  { cat: 'Кофты', items: [['green', 'Зелёная кофта'], ['striped', 'Полосатый свитер']] },
  { cat: 'Брюки и юбка', items: [['jeans', 'Джинсы'], ['lime', 'Салатовые штаны'], ['skirt', 'Полосатая юбка']] },
  { cat: 'На голову', items: [['crown', 'Корона'], ['red', 'Красная шапка'], ['pink', 'Розовая шапка'], ['yellow', 'Жёлтая шапка']] }
];
function wearing(id) { const o = S.outfit; if (id === 'crown') return !o.hat; if (['red', 'pink', 'yellow'].includes(id)) return o.hat === id; return o.dress === id || o.top === id || o.bottom === id; }
function wear(id) {
  const o = S.outfit;
  if (id === 'gown' || id === 'stars') { o.dress = id; o.top = null; o.bottom = null; }
  else if (id === 'green' || id === 'striped') { o.top = id; o.dress = null; if (!o.bottom) o.bottom = 'jeans'; }
  else if (['jeans', 'lime', 'skirt'].includes(id)) { o.bottom = id; o.dress = null; if (!o.top) o.top = 'green'; }
  else o.hat = id === 'crown' ? null : id;
  save();
}
SC.wardrobe = (back) => {
  if (back) S.back = back;
  add(svg(BG.ward() + `<g id="heroW" class="char">${at(330, 690 - 322 * 1.06, 1.06, ART.princess(S.outfit))}</g>`));
  topbar({ book: false, bag: false });
  const p = add(`<div class="ward sheet"><h2>Гардероб Альбины</h2><div class="ward-cats">${WARD.map(g => `<section class="ward-cat"><h3>${g.cat}</h3><div class="ward-items">${g.items.map(([id, n]) => `<button class="w-item" data-id="${id}" aria-pressed="${wearing(id)}"><svg viewBox="-50 -50 100 100" aria-hidden="true">${ART.item(id)}</svg><span>${n}</span></button>`).join('')}</div></section>`).join('')}</div><button class="btn" id="wDone">${S.back === 'bridge' ? 'Готово, на мост!' : 'Готово'}</button></div>`);
  $$('.w-item', p).forEach(b => b.onclick = () => {
    sfx.click(); wear(b.dataset.id);
    $('#heroW').innerHTML = at(330, 690 - 322 * 1.06, 1.06, ART.princess(S.outfit)); sparkle(330, 360, 8);
    $$('.w-item', p).forEach(x => x.setAttribute('aria-pressed', wearing(x.dataset.id)));
  });
  $('#wDone', p).onclick = () => { sfx.click(); const b = S.back; if (b === 'bridge') go('bridge'); else if (b === 'map') go('map'); else if (b === 'end') go('end'); else go('title'); };
};

/* ----- Альбом художницы ----- */
SC.album = () => {
  add(`<div class="album"><div class="album-head"><h2>Альбом художницы</h2><p>Все герои и места этой игры придуманы и нарисованы автором.</p></div><div class="album-grid">${(window.ALBUM || []).map((a, i) => `<button class="a-card" data-i="${i}"><img src="${a.src}" alt="${a.cap}"><span>${a.cap}</span></button>`).join('')}</div></div>`);
  topbar({ home: true, book: false, bag: false });
  $$('.a-card').forEach(b => b.onclick = () => {
    sfx.click(); const a = window.ALBUM[+b.dataset.i];
    const ov = add(`<div class="overlay"><div class="a-big sheet"><img src="${a.src}" alt="${a.cap}"><div class="a-big-row"><b>${a.cap}</b><button class="btn" id="aClose">Закрыть</button></div></div></div>`);
    $('#aClose', ov).onclick = () => ov.remove(); $('#aClose', ov).focus();
  });
};

/* ===== Запуск ===== */
document.getElementById('defs').innerHTML = ART.defs;
function start(data) {
  loadSave();
  if (data && data.S) S = Object.assign(clone(DEF_S), data.S);
  fit(); go('title');
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch (e) { }
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>
